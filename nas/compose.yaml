# vseismo gateway: a NAS (QNAP Container Station) or a small PC. See README.md.
#
#   station --HTTP pull--> bridge --DataLink--> ringserver --SeedLink :18000--> clients
#                                               (ring, SDS)
#                                                    |  relay profile only:
#                                                    +--SeedLink--> slink2dali --DataLink-->
#                                       autossh --SSH out--> relay ringserver (relay.example.org)
#
# Gateway mode (default): bridge, ringserver, sds-prune. SeedLink is served
# straight from this host; a router port forward can expose it.
# Relay mode: COMPOSE_PROFILES=relay in .env (or --profile relay) adds
# slink2dali and autossh, and the stream goes out to the VPS instead.
#
# The only ports published are SeedLink and bridge metrics, on LAN_ADDR.

name: vseismo

x-common: &common
  restart: unless-stopped
  user: "10000:10000"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  seismo:
    ipam:
      config:
        - subnet: 172.30.78.0/24

services:
  ringserver:
    <<: *common
    image: earthscope/ringserver:4.5.6
    command: ["/config/ring.conf"]
    environment:
      # The image defaults open every protocol on 18000; keep it SeedLink only.
      RS_LISTEN_PORT: "18000 SeedLink"
      RS_DATALINK_PORT: "16000"
    volumes:
      - ./ringserver/ring.conf:/config/ring.conf:ro
      - ${DATA_ROOT}/ring:/data/ring
      - ${DATA_ROOT}/sds:/data/sds
    ports:
      - "${LAN_ADDR}:18000:18000"
    networks:
      seismo: { ipv4_address: 172.30.78.2 }

  bridge:
    <<: *common
    build: ./bridge
    image: vseismo/bridge:local
    env_file: .env
    environment:
      DL_HOST: ringserver
      DL_PORT: "16000"
    volumes:
      - ${DATA_ROOT}/bridge:/data
    ports:
      - "${LAN_ADDR}:9108:9108"
    stop_grace_period: 30s          # time to flush open records on SIGTERM
    depends_on: [ringserver]
    networks:
      seismo: { ipv4_address: 172.30.78.10 }

  # Deletes SDS day files older than SDS_KEEP_DAYS, once a day. 0 keeps everything.
  sds-prune:
    <<: *common
    image: busybox:1.37.0
    init: true                      # sleep as PID 1 would ignore SIGTERM
    network_mode: none
    environment:
      SDS_KEEP_DAYS: ${SDS_KEEP_DAYS:-365}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          k=$${SDS_KEEP_DAYS:-0}
          if [ "$$k" -gt 0 ] 2>/dev/null; then
            find /data/sds -type f -mtime +$$k -print -delete
            find /data/sds -mindepth 1 -type d -empty -delete
          fi
          sleep 86400
        done
    volumes:
      - ${DATA_ROOT}/sds:/data/sds

  autossh:
    <<: *common
    profiles: [relay]
    build: ./autossh
    image: vseismo/autossh:local
    environment:
      RELAY_HOST: ${RELAY_HOST}
      RELAY_USER: ${RELAY_USER}
      RELAY_SSH_PORT: ${RELAY_SSH_PORT:-22}
    volumes:
      - ${DATA_ROOT}/ssh:/keys:ro
    networks:
      seismo: { ipv4_address: 172.30.78.20 }

  slink2dali:
    <<: *common
    profiles: [relay]
    build: ./slink2dali
    image: vseismo/slink2dali:local
    command:
      - "-v"
      - "-nd"
      - "10"
      - "-k"
      - "30"
      - "-x"
      - "/state/slink2dali.state:100"
      - "-S"
      - "${SEED_NET}_${SEED_STA}"
      - "ringserver:18000"
      - "autossh:16000"
    volumes:
      - ${DATA_ROOT}/slink2dali:/state
    depends_on: [ringserver, autossh]
    networks:
      seismo: { ipv4_address: 172.30.78.21 }
