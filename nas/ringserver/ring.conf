# ringserver on the gateway: local ring, SDS archive, SeedLink.
# Reference: run the image with -C for every option.

RingDirectory /data/ring
# How far back a SeedLink client can resume, at 2 channels x 100 SPS
# (about one 512-byte record every 2 s): 256M ~10 days, 512M ~3 weeks,
# 1G ~6 weeks. The SDS archive is the permanent copy either way. On a size
# change ringserver rebuilds the ring and carries over the packets that fit.
RingSize 512M
ServerID "vseismo gateway"
Verbosity 1
ResolveHostnames 0

# Ports are set in compose.yaml (RS_LISTEN_PORT, RS_DATALINK_PORT): the
# image presets them through the environment, which overrides this file.
#   16000 DataLink, from the bridge, inside the compose network only
#   18000 SeedLink only: LAN viewers (Swarm, ObsPy), slink2dali in relay
#         mode, public clients through a port forward in gateway mode

# Only the bridge (fixed address in compose.yaml) may write.
WriteIP 172.30.78.10

# Every record received over DataLink also lands in an SDS archive:
# <year>/<net>/<sta>/<chan>.D/<net>.<sta>.<loc>.<chan>.D.<year>.<doy>
MSeedWrite /data/sds/%Y/%n/%s/%c.D/%n.%s.%l.%c.D.%Y.%j
