# Site file for make_stationxml.py. Copy, fill in, keep the real one out of
# git: it holds your coordinates. They are rounded to 0.01 degree (about
# 1 km) in the output no matter how many digits you give here.

# network and station default to the station's own settings (/api/config).
#network: XX
#station: VSEIS
location: "00"

site:
  name: "Example site, Province, Country"
  latitude: 0.00
  longitude: 0.00
  elevation_m: 0          # ground level at the sensor
  depth_m: 0              # sensor depth below ground
  start: "2026-01-01T00:00:00"   # first real data; a new epoch starts when the setup changes

sender: "Your name or call sign"
source: "vseismo"

# Optional: who runs the station, written as the Station's <Operator>.
# agency is required if you use the block. An email here is public and
# gets harvested; leave contact out unless you want one listed.
#operator:
#  agency: "Your name or call sign"
#  website: "https://www.example.org"
#  contact: {name: "Your name", email: "you@example.org"}

# Which ADC channel feeds which SEED channel. Same codes as SEED_CHAN in
# gateway/.env. Dip -90 is vertical up, 0 horizontal. Leave azimuth null
# until it is measured; the file then carries a comment saying so.
channels:
  - {code: EHZ, adc_channel: 0, azimuth: 0, dip: -90}
  - {code: EH1, adc_channel: 1, azimuth: null, dip: 0}

# Frequency the stage gains and the overall sensitivity are quoted at. Keep
# it inside the passband: with the 10 Hz EQAMP build and a 4.5 Hz geophone
# the response peaks near 6 Hz and is already -5 dB at 10 Hz.
normalization_hz: 6.0

sensor:
  description: "Mark Products L-15B 4.5 Hz geophone"
  natural_hz: 4.5
  damping: 0.6            # fraction of critical, as loaded by the amplifier input
  # Used only with --draft while the station's chN_sens is 0. V/(m/s) as
  # loaded by the amplifier input (EQAMP: 10k). Coil variants differ: check
  # your geophone's label or measure, then set chN_sens on the station.
  sensitivity_nominal: 28.8

# Webtronics 3-channel EQAMP, 10 Hz build: values from the "Chan1-10Hz"
# schematic (L. Cochrane, 2017), matching the fitted CF parts (105 on CF3,
# CF5, CF7). U3 is an LF444 on this board, a TL074 on the schematic; the
# filter response is the same. -3 dB at about 8.7 Hz, -29 dB at 15 Hz.
# The "Chan1-18Hz" build (2009) uses RF1/RF8 33k, CF1/CF8 0.22 uF,
# Sallen-Key 11k/53.6k/0.47u/0.22u, 16.2k/82.5k/0.47u/0.1u,
# 61.9k/100k/0.47u/0.022u, high-pass 332k into 10 uF. Check your board.
amplifier:
  description: "Webtronics EQAMP 3-channel amplifier/filter, 10 Hz low-pass"
  gain_nominal: 1000      # --draft only, while chN_amp is 0
  passband_hz: 1.0        # where the gain above is defined
  highpass:               # C16 22 uF into R22 1.0M: 0.0072 Hz (138 s)
    - {r: 1.0e6, c: 22.0e-6}
  rc_lowpass:             # RF1/CF1 and RF8/CF8: 9.82 Hz each
    - {r: 16.2e3, c: 1.0e-6}
    - {r: 16.2e3, c: 1.0e-6}
  sallen_key:             # unity gain, c_fb to the output, c_gnd to ground
    - {r1: 11.0e3, r2: 49.9e3, c_fb: 1.0e-6, c_gnd: 0.47e-6}     # U3A: 9.91 Hz, Q 0.56
    - {r1: 15.0e3, r2: 71.5e3, c_fb: 1.0e-6, c_gnd: 0.22e-6}     # U3B: 10.36 Hz, Q 0.81
    - {r1: 40.2e3, r2: 274.0e3, c_fb: 1.0e-6, c_gnd: 0.022e-6}   # U3C: 10.22 Hz, Q 2.25

# Between the amplifier output and the ADC pin. The ratio itself comes from
# the station's chN_div; these values give the RC pole (about 3.8 kHz).
divider:
  r_top: 9100
  r_bottom: 1000
  c: 47.0e-9

datalogger: "vseismo: ESP32-C5 with TI ADS131M02, sinc3 + 201-tap FIR"
