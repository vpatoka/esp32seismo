# ringserver on the relay (OpenBSD VPS): /etc/ringserver.conf
#
# Data comes in over the SSH tunnel as DataLink on 127.0.0.1:16000 and goes
# out to the public as SeedLink on 18000. ringserver binds every address;
# pf keeps 16000 and 18080 off the internet, and WriteIP keeps writing to
# localhost (the tunnel) even if pf were wrong.

RingDirectory /var/ringserver/ring
# 512-byte Steim2 records run 15 to 40 MB a day for two channels at
# 100 SPS: this holds two to four weeks for clients that fall behind.
RingSize 512M
ServerID "vseismo relay (VE3VPT)"
Verbosity 1
ResolveHostnames 0

SeedLinkPort 18000
DataLinkPort 16000
# Stream list and server status for us, from the VPS itself:
#   ftp -o - http://127.0.0.1:18080/streams
HTTPPort 18080

# No WriteIP line: only localhost may write, which is the tunnel.

MaxClients 100
MaxClientsPerIP 10
ClientTimeout 3600

# Who connects and what they take, one file per day.
UsageLogDirectory /var/ringserver/log
UsageLogInterval 24
UsageLogJSONLines 1

# SeedLink over TLS on 18500 once the certificate is readable by
# _ringserver (see README.md). Few SeedLink clients use it yet.
#ListenPort 18500 SeedLink TLS
#TLSCertFile /var/ringserver/tls/fullchain.pem
#TLSKeyFile /var/ringserver/tls/privkey.pem
